<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111214">
<meta name="description" content="Prywatny dziennik, cele i aktywności.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Notatki</title>
<style>
:root{--bg:#f2f4f5;--card:#fff;--ink:#202a35;--muted:#6c7781;--line:#e0e5e8;--accent:#415a6b;--accent2:#dce7eb;--good:#34775a;--bad:#a54848;--shadow:0 8px 24px #1c29350a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:1100px;margin:auto;min-height:100dvh;padding-bottom:85px}.top{position:sticky;top:0;z-index:5;background:#f2f4f5ed;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:13px 18px;display:flex;align-items:center;gap:12px}.mark{width:36px;height:36px;border-radius:12px;background:#202a35;display:grid;place-items:center;color:white;font-size:19px}.brand{font-size:17px;font-weight:750;letter-spacing:.1px}.sub{font-size:12px;color:var(--muted)}.spacer{flex:1}.main{padding:18px;display:grid;gap:16px}.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}.pagehead h1{font-size:26px;margin:0;letter-spacing:-.7px}.muted{color:var(--muted)}.small{font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}.card h2{font-size:16px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stat{padding:14px}.stat .num{font-size:26px;font-weight:750;letter-spacing:-1px;margin-top:4px}.stat .label{color:var(--muted);font-size:12px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.btn{border:0;border-radius:12px;background:var(--ink);color:white;padding:11px 14px;font-weight:650}.btn.secondary{background:var(--accent2);color:var(--ink)}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#f8e6e6;color:var(--bad)}.btn.smallbtn{padding:7px 10px;font-size:13px}.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:12px;color:var(--muted);font-weight:650}.field input,.field textarea,.field select,.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 12px;color:var(--ink);outline:none}.field textarea{min-height:85px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus,.search:focus{border-color:#6c8b9b;box-shadow:0 0 0 3px #6c8b9b20}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.list{display:grid;gap:8px}.item{border:1px solid var(--line);border-radius:13px;padding:11px 12px;display:flex;gap:10px;align-items:flex-start}.item .grow{flex:1;min-width:0}.itemtitle{font-weight:700}.itemmeta{font-size:12px;color:var(--muted);margin-top:3px}.pill{font-size:11px;padding:4px 8px;background:#edf1f3;border-radius:99px;color:#40515d;white-space:nowrap}.check{width:20px;height:20px;accent-color:var(--good);flex-shrink:0;margin-top:2px}.nav{position:fixed;bottom:0;left:0;right:0;z-index:8;display:flex;gap:2px;overflow-x:auto;padding:8px max(8px,calc((100vw - 1050px)/2));background:#fffef9f2;border-top:1px solid var(--line);backdrop-filter:blur(14px)}.nav button{flex:1;min-width:64px;border:0;background:transparent;color:var(--muted);padding:7px 4px;border-radius:10px;font-size:10px}.nav button .ico{display:block;font-size:19px;margin-bottom:2px}.nav button.active{background:var(--accent2);color:var(--ink);font-weight:750}.bar{height:8px;border-radius:20px;background:#e8edef;overflow:hidden}.bar span{display:block;height:100%;background:#617f8f;border-radius:20px}.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:13px}.hidden{display:none!important}.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:48px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:5px 2px;text-align:center;color:var(--ink);font-size:12px}.day.today{outline:2px solid #6d8795}.day.selected{background:var(--ink);color:#fff}.day.hasdata:after{content:"";display:block;width:5px;height:5px;background:#6b9b82;border-radius:50%;margin:3px auto 0}.day.selected:after{background:#fff}.chart{width:100%;height:160px;display:block}.note{border-radius:12px;padding:12px;background:#f2f5f6;color:#44545f;font-size:13px}.dangertext{color:var(--bad)}.lock{min-height:100dvh;display:grid;place-items:center;padding:20px}.lockbox{width:min(100%,390px);text-align:center}.lockbox .mark{margin:0 auto 15px;width:52px;height:52px;font-size:25px}.pinDots{letter-spacing:9px;font-size:22px;text-align:center}.footerhint{font-size:11px;color:var(--muted);text-align:center;margin-top:16px}
@media(min-width:760px){.main{padding:24px;gap:18px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.nav{position:sticky;top:62px;bottom:auto;border:0;background:transparent;padding:10px 18px;max-width:1100px;margin:auto}.nav button{font-size:12px}.nav button .ico{display:inline;margin-right:5px;font-size:15px}.shell{padding-bottom:20px}.wide2{grid-column:span 2}.wide3{grid-column:span 3}}
@media(max-width:430px){.main{padding:13px}.top{padding:11px 13px}.pagehead h1{font-size:23px}.card{padding:13px}.two{grid-template-columns:1fr}.stat .num{font-size:23px}}

/* Ciemny motyw: grafit + żółty, czerwony i zielony */
:root{
  color-scheme:dark;
  --bg:#111214;--card:#1b1d21;--ink:#f3f3ef;--muted:#a2a6ad;
  --line:#34373d;--accent:#f2c230;--accent2:#3a3218;
  --good:#35c979;--bad:#ff5b62;--shadow:0 8px 24px #00000035;
}
body{background:var(--bg);color:var(--ink)}
.top{background:#111214ed}
.mark{background:#f2c230;color:#171717}
.btn{background:#f2c230;color:#171717}
.btn.secondary{background:#3a3218;color:#ffe28a}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:#431f23;color:#ff777d}
.field input,.field textarea,.field select,.search{background:#141518;color:var(--ink);border-color:var(--line)}
.field input:focus,.field textarea:focus,.field select:focus,.search:focus{border-color:#f2c230;box-shadow:0 0 0 3px #f2c23022}
.check{accent-color:var(--good)}
.nav{background:#17181bf2;border-color:var(--line)}
.nav button.active{background:#3a3218;color:#ffe28a}
.pill{background:#2b2e33;color:#e3e5e8}
.bar{background:#303339}
.bar span{background:linear-gradient(90deg,#f2c230,#35c979)}
.day{background:#1b1d21;color:var(--ink);border-color:var(--line)}
.day.today{outline-color:#f2c230}
.day.selected{background:#f2c230;color:#171717}
.day.hasdata:after{background:#35c979}
.day.selected:after{background:#171717}
.note{background:#24271f;color:#e8e9df}
.empty{border-color:#41444b}
.item{background:#1b1d21;border-color:var(--line)}
.dangertext{color:var(--bad)}

</style>
</head>
<body>
<div id="root"></div>
<script>
const $ = s => document.querySelector(s);
const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const fmtDate = s => s ? new Date(s+'T12:00:00').toLocaleDateString('pl-PL',{day:'numeric',month:'long',year:'numeric'}) : '';
const uid = () => crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random().toString(16).slice(2);
const blankData = () => ({version:1,activities:[
{id:'walk',name:'Spacer',category:'Zdrowie',unit:'min'},
{id:'read',name:'Czytanie',category:'Rozwój',unit:'min'},
{id:'push',name:'Pompki',category:'Trening',unit:'powtórzenia'},
{id:'water',name:'Woda',category:'Zdrowie',unit:'szklanki'},
{id:'gym',name:'Siłownia',category:'Trening',unit:'razy'},
{id:'sleep',name:'Sen',category:'Zdrowie',unit:'godz.'}
],logs:{},goals:[],events:[],transactions:[],notes:[],settings:{autoLock:5,dayTypes:[{value:'normal',label:'Zwykły dzień'},{value:'work',label:'Praca przez cały dzień'},{value:'low',label:'Słabszy dzień / mało energii'},{value:'rest',label:'Zaplanowany odpoczynek'},{value:'custom',label:'Inny powód'}]},finance:[],financeSnapshots:[]});
let data=null, key=null, salt=null, currentTab='home', selectedDate=todayISO(), calendarMonth=new Date(), searchText='', historyFilter='all', pinDigits='', lockTimer=null;
const enc = new TextEncoder(), dec = new TextDecoder();
function b64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf)))}
function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function derive(pin,s){const material=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:250000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptObj(obj,k){const iv=crypto.getRandomValues(new Uint8Array(12));const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(obj)));return {iv:b64(iv),cipher:b64(cipher)}}
async function decryptObj(box,k){const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(box.iv)},k,unb64(box.cipher));return JSON.parse(dec.decode(plain))}
function getVault(){try{return JSON.parse(localStorage.getItem('mk_vault')||'null')}catch{return null}}
async function save(){const box=await encryptObj(data,key);localStorage.setItem('mk_vault',JSON.stringify({v:1,salt:b64(salt),box,updated:new Date().toISOString()}))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function logFor(date){return data.logs[date]||(data.logs[date]={activities:{},thoughts:'',achievement:'',lesson:'',mood:'',dayType:'normal',updated:new Date().toISOString()})}
function ensureSettings(){data.settings=data.settings||{autoLock:5};if(!Array.isArray(data.settings.dayTypes)||!data.settings.dayTypes.length)data.settings.dayTypes=[{value:'normal',label:'Zwykły dzień'},{value:'work',label:'Praca przez cały dzień'},{value:'low',label:'Słabszy dzień / mało energii'},{value:'rest',label:'Zaplanowany odpoczynek'},{value:'custom',label:'Inny powód'}];if(!Array.isArray(data.financeSnapshots))data.financeSnapshots=[];}
function activityCountInRange(id,start,end){let count=0,total=0;for(const [date,log] of Object.entries(data.logs)){if(date>=start&&date<=end&&log.activities&&log.activities[id]){const x=log.activities[id];if(x.done){count++;total+=1}}}return {count,total}}
function startOfWeek(date){const d=new Date(date+'T12:00:00');const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function addDays(date,n){const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function monthRange(date){const [y,m]=date.split('-').map(Number);return {start:`${y}-${String(m).padStart(2,'0')}-01`,end:`${y}-${String(m).padStart(2,'0')}-${String(new Date(y,m,0).getDate()).padStart(2,'0')}`}}
function rangeStats(start,end){const dates=Object.keys(data.logs).filter(d=>d>=start&&d<=end);let count=0, activeDays=0;for(const d of dates){const l=data.logs[d];const acts=Object.values(l.activities||{}).filter(a=>a&&a.done);count+=acts.length;if(acts.length||l.thoughts||l.achievement)activeDays++}return {dates:dates.length,activeDays,count}}
function monthName(d){return d.toLocaleDateString('pl-PL',{month:'long',year:'numeric'})}
function render(){const root=$('#root');if(!data){renderLock();return}ensureSettings();
root.innerHTML=`<div class="shell"><header class="top"><div class="mark">◈</div><div><div class="brand">Notatki</div><div class="sub">Twoja prywatna przestrzeń</div></div><div class="spacer"></div><button class="btn ghost smallbtn" id="lockNow" aria-label="Zablokuj">Zablokuj</button></header><nav class="nav">${[['home','⌂','Dziś'],['journal','▤','Dziennik'],['history','⌕','Szukaj'],['goals','◎','Cele'],['calendar','▦','Kalendarz'],['summary','↗','Postępy'],['money','◌','Finanse'],['settings','⚙','Ustawienia']].map(([id,ico,label])=>`<button data-tab="${id}" class="${currentTab===id?'active':''}"><span class="ico">${ico}</span>${label}</button>`).join('')}</nav><main class="main">${pageContent()}</main></div>`;
root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;render()});
$('#lockNow').onclick=()=>lockApp();
bindPage();resetLockTimer();}
function pageContent(){switch(currentTab){case'home':return homePage();case'journal':return journalPage();case'history':return historyPage();case'goals':return goalsPage();case'calendar':return calendarPage();case'summary':return summaryPage();case'money':return moneyPage();case'settings':return settingsPage();default:return homePage()}}
function homePage(){const log=logFor(selectedDate);const completed=data.activities.filter(a=>{const x=log.activities[a.id]||{};return !!x.done}).length;const [start,end]=[startOfWeek(selectedDate),addDays(startOfWeek(selectedDate),6)];const stats=rangeStats(start,end);const openGoals=data.goals.filter(g=>!g.done);const dayTypes=data.settings.dayTypes;return `<div class="pagehead"><div><div class="muted small">${fmtDate(selectedDate)}</div><h1>Twój dzień</h1></div><button class="btn secondary" id="changeDay">Zmień datę</button></div><div class="grid"><div class="card stat"><div class="label">Aktywności dziś</div><div class="num">${completed}/${data.activities.length}</div><div class="muted small">zaznaczone wykonane</div></div><div class="card stat"><div class="label">Dni z wpisami w tygodniu</div><div class="num">${stats.activeDays}/7</div><div class="muted small">bez oceniania przerw</div></div><div class="card stat"><div class="label">Aktywne cele</div><div class="num">${openGoals.length}</div><div class="muted small">na Twoich zasadach</div></div><div class="card stat"><div class="label">Notatki łącznie</div><div class="num">${Object.values(data.logs).filter(l=>l.thoughts||l.achievement).length}</div><div class="muted small">dni zapisanych</div></div></div><section class="card"><div class="row between"><h2>Moje cele i postępy</h2><button class="btn ghost smallbtn" data-jump="goals">Edytuj cele</button></div>${openGoals.slice(0,5).map(g=>`<div style="margin:12px 0"><div class="row between"><strong>${esc(g.name)}</strong><span class="pill">${esc(g.type||'Cel')}</span></div>${g.date?`<div class="itemmeta">Termin: ${fmtDate(g.date)}</div>`:''}${g.next?`<div class="itemmeta">Następny krok: ${esc(g.next)}</div>`:''}<div class="row wrap" style="margin-top:8px"><button class="btn ghost smallbtn" data-goaldone="${g.id}">Oznacz jako osiągnięty</button></div></div>`).join('')||'<div class="empty">Nie masz aktywnych celów. Dodaj pierwszy, żeby widzieć go tutaj.</div>'}<button class="btn secondary" data-jump="goals">+ Dodaj / zobacz wszystkie cele</button></section><section class="card"><div class="row between"><h2>Aktywności</h2><div class="row"><button class="btn ghost smallbtn" id="manageActs">Edytuj listę</button><button class="btn secondary smallbtn" id="addAct">+ Dodaj</button></div></div><p class="muted small">Zaznacz tylko te, które dziś wykonałeś. Nie musisz niczego liczyć.</p><div class="list">${data.activities.map(a=>{const x=log.activities[a.id]||{};return `<label class="item" style="align-items:center"><input class="check" type="checkbox" data-actdone="${a.id}" ${x.done?'checked':''} aria-label="${esc(a.name)}"><div class="grow"><div class="itemtitle">${esc(a.name)}</div><div class="itemmeta">${esc(a.category||'Własna')}</div></div></label>`}).join('')||'<div class="empty">Dodaj swoją pierwszą aktywność.</div>'}</div></section><section class="card"><div class="row between"><h2>Jak minął dzień?</h2><button class="btn ghost smallbtn" id="manageDayTypes">Edytuj rodzaje dni</button></div><div class="field"><label>Rodzaj dnia (opcjonalnie)</label><select id="dayType">${dayTypes.map(t=>`<option value="${esc(t.value)}" ${log.dayType===t.value?'selected':''}>${esc(t.label)}</option>`).join('')}</select></div><div class="field"><label>Moje przemyślenia</label><textarea id="thoughts" placeholder="Co się wydarzyło? Co mam w głowie?">${esc(log.thoughts)}</textarea></div><div class="field"><label>Osiągnięcie dnia</label><textarea id="achievement" placeholder="Co dziś poszło dobrze?">${esc(log.achievement)}</textarea></div><div class="field"><label>Wniosek / czego się nauczyłem</label><textarea id="lesson" placeholder="Co chcę zapamiętać?">${esc(log.lesson)}</textarea></div><div class="field"><label>Nastrój (opcjonalnie)</label><select id="mood"><option value="">Nie wpisuję</option>${[['great','Bardzo dobry'],['good','Dobry'],['ok','Zwyczajny'],['low','Słabszy'],['bad','Trudny']].map(([v,t])=>`<option value="${v}" ${log.mood===v?'selected':''}>${t}</option>`).join('')}</select></div><button class="btn" id="saveDay">Zapisz dzień</button><span class="muted small" id="saveStatus" style="margin-left:8px"></span></section><section class="card"><h2>Szybki dostęp</h2><div class="row wrap"><button class="btn ghost" data-jump="journal">Otwórz dziennik</button><button class="btn ghost" data-jump="history">Znajdź wcześniejszy wpis</button><button class="btn ghost" data-jump="summary">Podsumowanie tygodnia</button></div></section>`}
function journalPage(){const l=logFor(selectedDate);return `<div class="pagehead"><div><div class="muted small">Własne zapiski</div><h1>Dziennik</h1></div></div><section class="card"><div class="field"><label>Wybierz dzień</label><input type="date" id="journalDate" value="${selectedDate}"></div><div class="field"><label>Co się wydarzyło?</label><textarea id="jThoughts" rows="5" placeholder="Zapisz swoje myśli, obserwacje i wydarzenia...">${esc(l.thoughts)}</textarea></div><div class="field"><label>Co udało mi się osiągnąć?</label><textarea id="jAchieve" rows="3">${esc(l.achievement)}</textarea></div><div class="field"><label>Wniosek / lekcja</label><textarea id="jLesson" rows="3">${esc(l.lesson)}</textarea></div><div class="field"><label>Samopoczucie</label><select id="jMood"><option value="">Bez oceny</option>${[['great','Bardzo dobre'],['good','Dobre'],['ok','Zwyczajne'],['low','Słabsze'],['bad','Trudne']].map(([v,t])=>`<option value="${v}" ${l.mood===v?'selected':''}>${t}</option>`).join('')}</select></div><button class="btn" id="saveJournal">Zapisz wpis</button></section><section class="card"><h2>Ostatnie wpisy</h2><div class="list">${Object.entries(data.logs).filter(([d,l])=>l.thoughts||l.achievement||l.lesson).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,8).map(([d,l])=>`<button class="item" style="text-align:left;background:white;width:100%" data-open-date="${d}"><div class="grow"><div class="itemtitle">${fmtDate(d)}</div><div class="itemmeta">${esc((l.achievement||l.thoughts||l.lesson).slice(0,100))}</div></div><span>›</span></button>`).join('')||'<div class="empty">Nie masz jeszcze zapisanych przemyśleń.</div>'}</div></section>`}
function historyPage(){const q=searchText.toLowerCase();const dates=Object.keys(data.logs).sort((a,b)=>b.localeCompare(a));const filtered=dates.filter(d=>{const l=data.logs[d];const text=[d,l.thoughts,l.achievement,l.lesson,l.dayType,...data.activities.filter(a=>l.activities?.[a.id]).map(a=>a.name)].join(' ').toLowerCase();return (!q||text.includes(q))&&(historyFilter==='all'||(l.activities?.[historyFilter]&&l.activities[historyFilter].done))});return `<div class="pagehead"><div><div class="muted small">Historia i szybkie wyszukiwanie</div><h1>Szukaj</h1></div></div><section class="card"><div class="field"><label>Szukaj aktywności, przemyśleń lub daty</label><input class="search" id="historySearch" value="${esc(searchText)}" placeholder="Np. pływanie, siłownia, dobry dzień..."></div><div class="field"><label>Filtr aktywności</label><select id="historyFilter"><option value="all">Wszystkie aktywności</option>${data.activities.map(a=>`<option value="${a.id}" ${historyFilter===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div><div class="muted small">Wyniki: ${filtered.length} dni. Wybierz wpis, aby go edytować.</div></section><section class="card"><div class="list">${filtered.map(d=>{const l=data.logs[d];const acts=data.activities.filter(a=>l.activities?.[a.id]&&(l.activities[a.id].done||Number(l.activities[a.id].value)>0));return `<button class="item" style="text-align:left;background:white;width:100%" data-open-date="${d}"><div class="grow"><div class="itemtitle">${fmtDate(d)}</div><div class="itemmeta">${acts.map(a=>esc(a.name)).join(' · ')||'Bez oznaczonych aktywności'}</div><div class="itemmeta">${esc((l.achievement||l.thoughts||l.lesson||'').slice(0,130))}</div></div><span>›</span></button>`}).join('')||'<div class="empty">Brak pasujących wpisów. Spróbuj innego hasła.</div>'}</div></section><section class="card"><h2>Podsumowanie aktywności</h2>${data.activities.map(a=>{const m=monthRange(todayISO()),s=activityCountInRange(a.id,m.start,m.end);return `<div style="margin:10px 0"><div class="row between"><span>${esc(a.name)}</span><strong>${s.count} razy w tym miesiącu</strong></div><div class="bar" style="margin-top:6px"><span style="width:${Math.min(100,s.count*12)}%"></span></div></div>`}).join('')}</section>`}
function goalsPage(){return `<div class="pagehead"><div><div class="muted small">Kierunek i priorytety</div><h1>Moje cele</h1></div><button class="btn" id="newGoal">+ Cel</button></div><section class="card"><h2>Dodaj cel</h2><div class="field"><label>Nazwa celu</label><input id="goalName" placeholder="Np. zbudować poduszkę finansową"></div><div class="two"><div class="field"><label>Termin</label><input type="date" id="goalDate"></div><div class="field"><label>Rodzaj</label><select id="goalType"><option>Długoterminowy</option><option>Roczny</option><option>Kwartalny</option><option>Miesięczny</option><option>Tygodniowy</option></select></div></div><div class="field"><label>Dlaczego jest ważny?</label><textarea id="goalWhy" rows="2"></textarea></div><div class="field"><label>Następny krok</label><input id="goalNext" placeholder="Jaki jest najmniejszy kolejny krok?"></div><button class="btn" id="saveGoal">Dodaj cel</button></section><section class="card"><h2>Twoja lista</h2><div class="list">${data.goals.map(g=>`<div class="item"><input type="checkbox" class="check" data-goaldone="${g.id}" ${g.done?'checked':''}><div class="grow"><div class="itemtitle" style="${g.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(g.name)}</div><div class="itemmeta">${esc(g.type)}${g.date?' · termin: '+fmtDate(g.date):''}</div>${g.why?`<div class="itemmeta">${esc(g.why)}</div>`:''}${g.next?`<div class="itemmeta">Następny krok: ${esc(g.next)}</div>`:''}</div><button class="btn ghost smallbtn" data-delete-goal="${g.id}">Usuń</button></div>`).join('')||'<div class="empty">Nie masz jeszcze celów. Dodaj jeden, od którego chcesz zacząć.</div>'}</div></section>`}
function calendarPage(){const y=calendarMonth.getFullYear(),m=calendarMonth.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),offset=(first.getDay()+6)%7;const monthDates=Array.from({length:days},(_,i)=>`${y}-${String(m+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`);return `<div class="pagehead"><div><div class="muted small">Przeszłość i plany</div><h1>Kalendarz</h1></div><button class="btn" id="addEvent">+ Wydarzenie</button></div><section class="card"><div class="row between"><button class="btn ghost smallbtn" id="prevMonth">‹</button><h2 style="margin:0;text-transform:capitalize">${monthName(calendarMonth)}</h2><button class="btn ghost smallbtn" id="nextMonth">›</button></div><div class="daygrid" style="margin-top:14px">${['Pn','Wt','Śr','Cz','Pt','So','Nd'].map(x=>`<div class="muted small" style="text-align:center">${x}</div>`).join('')}${Array.from({length:offset},()=>'<div></div>').join('')}${monthDates.map(d=>`<button class="day ${d===todayISO()?'today':''} ${d===selectedDate?'selected':''} ${data.logs[d]||data.events.some(e=>e.date===d)?'hasdata':''}" data-calday="${d}">${Number(d.slice(-2))}</button>`).join('')}</div><div class="field"><label>Wybrany dzień</label><input type="date" id="calendarSelected" value="${selectedDate}"></div></section><section class="card"><div class="row between"><h2>${fmtDate(selectedDate)}</h2><button class="btn ghost smallbtn" id="dayToJournal">Dziennik dnia</button></div><h2 style="margin-top:16px">Wydarzenia</h2><div class="list">${data.events.filter(e=>e.date===selectedDate).map(e=>`<div class="item"><div class="grow"><div class="itemtitle">${esc(e.title)}</div><div class="itemmeta">${e.time?esc(e.time)+' · ':''}${esc(e.description||'')}</div></div><button class="btn ghost smallbtn" data-delete-event="${e.id}">Usuń</button></div>`).join('')||'<div class="empty">Brak wydarzeń w tym dniu.</div>'}</div></section>`}
function summaryPage(){const ws=startOfWeek(selectedDate),we=addDays(ws,6),ms=monthRange(selectedDate),w=rangeStats(ws,we),m=rangeStats(ms.start,ms.end);const prevStart=addDays(ms.start,-1),prev=monthRange(prevStart),p=rangeStats(prev.start,prev.end);const bestDays=Object.entries(data.logs).filter(([d,l])=>d>=ms.start&&d<=ms.end&&l.achievement).sort((a,b)=>b[0].localeCompare(a[0]));return `<div class="pagehead"><div><div class="muted small">Twoje osiągnięcia, bez presji</div><h1>Podsumowania</h1></div><button class="btn secondary" id="summaryDate">Zmień datę</button></div><section class="card"><div class="row between"><h2>Ten tydzień</h2><span class="pill">${fmtDate(ws)} – ${fmtDate(we)}</span></div><div class="grid"><div class="card stat"><div class="label">Aktywności</div><div class="num">${w.count}</div></div><div class="card stat"><div class="label">Dni z wpisami</div><div class="num">${w.activeDays}/7</div></div></div><h2 style="margin-top:14px">Co robiłeś?</h2>${data.activities.map(a=>{const s=activityCountInRange(a.id,ws,we);return `<div style="margin:10px 0"><div class="row between"><span>${esc(a.name)}</span><strong>${s.count} razy</strong></div><div class="bar" style="margin-top:5px"><span style="width:${Math.min(100,s.count*14)}%"></span></div></div>`}).join('')}<h2 style="margin-top:16px">Twoje osiągnięcia</h2><div class="list">${Object.entries(data.logs).filter(([d,l])=>d>=ws&&d<=we&&l.achievement).sort((a,b)=>a[0].localeCompare(b[0])).map(([d,l])=>`<div class="item"><div class="grow"><div class="itemtitle">${fmtDate(d)}</div><div>${esc(l.achievement)}</div></div></div>`).join('')||'<div class="empty">Nie zapisano jeszcze osiągnięć w tym tygodniu.</div>'}</div></section><section class="card"><div class="row between"><h2>Ten miesiąc</h2><span class="pill" style="text-transform:capitalize">${new Date(selectedDate+'T12:00:00').toLocaleDateString('pl-PL',{month:'long',year:'numeric'})}</span></div><div class="grid"><div class="card stat"><div class="label">Aktywności</div><div class="num">${m.count}</div></div><div class="card stat"><div class="label">Dni z wpisami</div><div class="num">${m.activeDays}</div></div><div class="card stat"><div class="label">Cele zakończone</div><div class="num">${data.goals.filter(g=>g.done&&g.date&&g.date>=ms.start&&g.date<=ms.end).length}</div></div><div class="card stat"><div class="label">Wydarzenia</div><div class="num">${data.events.filter(e=>e.date>=ms.start&&e.date<=ms.end).length}</div></div></div><h2 style="margin-top:12px">Porównanie z poprzednim miesiącem</h2><div class="row between"><span>Aktywności</span><strong>${m.count-p.count>=0?'+':''}${m.count-p.count}</strong></div><div class="muted small">Bieżący miesiąc: ${m.count}; poprzedni: ${p.count}. Wynik zmienia się wraz z wpisami.</div><h2 style="margin-top:16px">Najważniejsze osiągnięcia</h2><div class="list">${bestDays.map(([d,l])=>`<div class="item"><div class="grow"><div class="itemtitle">${fmtDate(d)}</div><div>${esc(l.achievement)}</div></div></div>`).join('')||'<div class="empty">Dopisuj osiągnięcia do dni, a pojawią się tutaj.</div>'}</div></section><div class="note">Podsumowania liczą tylko to, co zostało zapisane. Puste dni nie są traktowane jako porażka.</div>`}
function moneyPage(){ensureSettings();const snapshots=data.financeSnapshots.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.created.localeCompare(b.created));const latest=snapshots[snapshots.length-1];const previous=snapshots.length>1?snapshots[snapshots.length-2]:null;const change=latest&&previous?Number(latest.amount)-Number(previous.amount):null;return `<div class="pagehead"><div><div class="muted small">Prosto: stan i zmiana kwoty</div><h1>Finanse</h1></div></div><section class="card"><h2>Aktualna kwota</h2>${latest?`<div class="grid"><div class="card stat"><div class="label">Ostatni zapisany stan</div><div class="num">${Number(latest.amount).toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2})} zł</div><div class="muted small">${fmtDate(latest.date)}</div></div><div class="card stat"><div class="label">Zmiana od poprzedniego wpisu</div><div class="num" style="color:${change===null?'var(--ink)':change>=0?'var(--good)':'var(--bad)'}">${change===null?'—':(change>0?'+':'')+change.toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2})+' zł'}</div><div class="muted small">${previous?'W porównaniu z '+fmtDate(previous.date):'Dodaj kolejny wpis, aby zobaczyć zmianę'}</div></div></div>`:'<div class="empty">Dodaj pierwszą kwotę, żeby rozpocząć śledzenie zmian.</div>'}<p class="muted">Wpisuj łączną kwotę, którą chcesz obserwować. Każdy kolejny zapis pokaże, o ile wzrosła lub spadła. To nie dodaje kwot do siebie.</p><div class="field"><label>Kwota obecnie (zł)</label><input type="number" id="snapshotAmount" min="0" step=".01" placeholder="Np. 125000" inputmode="decimal"></div><div class="field"><label>Data wpisu</label><input type="date" id="snapshotDate" value="${selectedDate}"></div><button class="btn" id="saveSnapshot">Zapisz aktualną kwotę</button></section><section class="card"><div class="row between"><h2>Historia zmian</h2><span class="pill">${snapshots.length} wpisów</span></div><div class="list">${snapshots.slice().reverse().map((x,i,arr)=>{const older=arr[i+1];const delta=older?Number(x.amount)-Number(older.amount):null;return `<div class="item"><div class="grow"><div class="itemtitle">${Number(x.amount).toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2})} zł</div><div class="itemmeta">${fmtDate(x.date)}</div></div>${delta===null?'':`<strong style="color:${delta>=0?'var(--good)':'var(--bad)'}">${delta>0?'+':''}${delta.toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2})} zł</strong>`}<button class="btn ghost smallbtn" data-delete-snapshot="${x.id}">Usuń</button></div>`}).join('')||'<div class="empty">Historia pojawi się po zapisaniu pierwszej kwoty.</div>'}</div></section>`}
function settingsPage(){return `<div class="pagehead"><div><div class="muted small">Prywatność i kopie zapasowe</div><h1>Ustawienia</h1></div></div><section class="card"><h2>Kopia zapasowa</h2><p class="muted">Eksport obejmuje aktywności, wpisy, cele, wydarzenia i finanse. Plik jest zaszyfrowany kluczem wyprowadzonym z Twojego PIN-u. Nie udostępniaj PIN-u ani kopii innym osobom.</p><div class="row wrap"><button class="btn" id="exportData">Eksportuj zaszyfrowaną kopię</button><label class="btn secondary" for="importFile">Przywróć kopię</label><input type="file" id="importFile" accept=".json,application/json" class="hidden"></div><p class="muted small" id="backupStatus"></p></section><section class="card"><h2>Bezpieczeństwo</h2><div class="note">Dane aplikacji są szyfrowane lokalnie przy użyciu AES-GCM, a klucz jest wyprowadzany z PIN-u. Nie ma konta ani serwera. Jeśli zapomnisz PIN, nie będzie możliwości odzyskania danych bez wcześniejszej kopii i właściwego PIN-u.</div><div class="field"><label>Automatyczna blokada</label><select id="autoLock"><option value="1">Po 1 minucie</option><option value="5">Po 5 minutach</option><option value="15">Po 15 minutach</option><option value="0">Tylko ręcznie</option></select></div><button class="btn secondary" id="changePin">Zmień PIN</button><button class="btn ghost" id="lockSettings" style="margin-left:6px">Zablokuj teraz</button></section><section class="card"><h2>Rozbudowa i dane</h2><p class="muted">Aplikacja jest przygotowana jako modułowy punkt startowy. Można dodawać nowe sekcje bez przebudowywania wszystkich istniejących danych.</p><button class="btn danger" id="deleteAll">Usuń wszystkie dane</button><p class="muted small">Ta operacja jest nieodwracalna. Najpierw wykonaj kopię, jeśli chcesz zachować wpisy.</p></section><section class="card"><h2>O aplikacji</h2><p class="muted">Notatki · prywatny dziennik i plan dnia. Działa lokalnie na urządzeniu po zainstalowaniu jako aplikacja internetowa (PWA).</p><p class="muted small">To pierwsza wersja. Przed przechowywaniem bardzo ważnych danych zalecana jest regularna kopia zapasowa.</p></section>`}
function renderLock(message=''){const v=getVault();$('#root').innerHTML=`<div class="lock"><div class="lockbox"><div class="mark">◈</div><h1 style="margin:0 0 6px">Notatki</h1><p class="muted">${v?'Wpisz PIN, aby otworzyć swoje dane.':'Ustaw PIN, który będzie chronił Twoje prywatne wpisy.'}</p><form id="pinForm"><div class="field"><label>${v?'PIN':'Nowy PIN (co najmniej 6 cyfr)'}</label><input class="pinDots" id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" autocomplete="off" required minlength="6" placeholder="••••••" autofocus></div>${v?'':`<div class="field"><label>Powtórz PIN</label><input class="pinDots" id="pinConfirm" type="password" inputmode="numeric" maxlength="12" required minlength="6" placeholder="••••••"></div>`}<button class="btn" style="width:100%;margin-top:8px">${v?'Odblokuj':'Utwórz prywatny dziennik'}</button></form><p class="dangertext" id="pinError">${esc(message)}</p><div class="footerhint">Twoje dane pozostają na tym urządzeniu. Nie ma odzyskiwania PIN-u.</div></div></div>`;$('#pinForm').onsubmit=async e=>{e.preventDefault();const pin=$('#pinInput').value;if(!/^\d{6,12}$/.test(pin)){renderLock('PIN musi mieć od 6 do 12 cyfr.');return}const vault=getVault();try{if(!vault){if(pin!==$('#pinConfirm').value){renderLock('PIN-y nie są takie same.');return}salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(pin,salt);data=blankData();await save();currentTab='home';render()}else{salt=unb64(vault.salt);key=await derive(pin,salt);data=await decryptObj(vault.box,key);currentTab='home';render()}}catch{key=null;data=null;renderLock('Nieprawidłowy PIN albo uszkodzone dane.')} }}
function resetLockTimer(){clearTimeout(lockTimer);if(data&&Number(data.settings?.autoLock)>0)lockTimer=setTimeout(()=>lockApp(),Number(data.settings.autoLock)*60000)}
async function lockApp(){if(data&&key)await save();data=null;key=null;salt=null;renderLock()}
function bindPage(){
document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{currentTab=b.dataset.jump;render()});
document.querySelectorAll('[data-open-date]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.openDate;currentTab='journal';render()});
if($('#changeDay'))$('#changeDay').onclick=()=>{const val=prompt('Wpisz datę w formacie RRRR-MM-DD',selectedDate);if(val&&/^\d{4}-\d{2}-\d{2}$/.test(val)){selectedDate=val;render()}};
document.querySelectorAll('[data-actdone]').forEach(el=>el.onchange=async()=>{logFor(selectedDate).activities[el.dataset.actdone]={done:el.checked};await save();render()});
document.querySelectorAll('[data-actsave]').forEach(el=>el.onclick=async()=>{const id=el.dataset.actsave,v=$(`[data-actval="${id}"]`).value;logFor(selectedDate).activities[id]={...(logFor(selectedDate).activities[id]||{}),value:v,done:(logFor(selectedDate).activities[id]||{}).done||Number(v)>0};await save();render()});
if($('#saveDay'))$('#saveDay').onclick=async()=>{const l=logFor(selectedDate);l.dayType=$('#dayType').value;l.thoughts=$('#thoughts').value;l.achievement=$('#achievement').value;l.lesson=$('#lesson').value;l.mood=$('#mood').value;l.updated=new Date().toISOString();await save();$('#saveStatus').textContent='Zapisano';setTimeout(()=>{if($('#saveStatus'))$('#saveStatus').textContent=''},1600)};
if($('#manageActs'))$('#manageActs').onclick=()=>{const names=data.activities.map(a=>a.name).join(', ');const newNames=prompt('Lista aktywności — wpisz nazwy oddzielone przecinkami. Zachowaj nazwę, jeśli chcesz zachować historię tej aktywności.',names);if(newNames===null)return;const arr=newNames.split(',').map(x=>x.trim()).filter(Boolean);const old=data.activities.slice();data.activities=arr.map(name=>{const match=old.find(a=>a.name.toLowerCase()===name.toLowerCase());return match||{id:uid(),name,category:'Własna'}});save().then(render)};
if($('#addAct'))$('#addAct').onclick=()=>{const name=prompt('Nazwa nowej aktywności');if(!name?.trim())return;const category=prompt('Kategoria (np. zdrowie, rozwój, trening)','Własna')||'Własna';data.activities.push({id:uid(),name:name.trim(),category});save().then(render)};
if($('#manageDayTypes'))$('#manageDayTypes').onclick=()=>{const existing=data.settings.dayTypes.map(t=>t.label).join(', ');const raw=prompt('Wpisz własne rodzaje dni, oddzielone przecinkami. Ta lista zastąpi obecną; stare wpisy w dzienniku pozostaną.',existing);if(raw===null)return;const labels=[...new Set(raw.split(',').map(x=>x.trim()).filter(Boolean))];if(!labels.length){alert('Lista musi zawierać przynajmniej jeden rodzaj dnia.');return}data.settings.dayTypes=labels.map(label=>({value:'day_'+label.toLowerCase().replace(/[^a-z0-9ąćęłńóśźż]+/gi,'_')+'_'+uid().slice(0,5),label}));Object.values(data.logs).forEach(l=>{if(!data.settings.dayTypes.some(t=>t.value===l.dayType))l.dayType='';});save().then(render)};
if($('#saveJournal'))$('#saveJournal').onclick=async()=>{selectedDate=$('#journalDate').value||selectedDate;const l=logFor(selectedDate);l.thoughts=$('#jThoughts').value;l.achievement=$('#jAchieve').value;l.lesson=$('#jLesson').value;l.mood=$('#jMood').value;l.updated=new Date().toISOString();await save();render()};
if($('#journalDate'))$('#journalDate').onchange=()=>{selectedDate=$('#journalDate').value;render()};
if($('#historySearch'))$('#historySearch').oninput=e=>{searchText=e.target.value;const pos=e.target.selectionStart;render();const el=$('#historySearch');el.focus();el.setSelectionRange(pos,pos)};
if($('#historyFilter'))$('#historyFilter').onchange=e=>{historyFilter=e.target.value;render()};
if($('#newGoal'))$('#newGoal').onclick=()=>$('#goalName').focus();
if($('#saveGoal'))$('#saveGoal').onclick=async()=>{const name=$('#goalName').value.trim();if(!name){alert('Wpisz nazwę celu.');return}data.goals.push({id:uid(),name,date:$('#goalDate').value,type:$('#goalType').value,why:$('#goalWhy').value,next:$('#goalNext').value,done:false,created:todayISO()});await save();render()};
document.querySelectorAll('[data-goaldone]').forEach(el=>{const toggle=async()=>{const g=data.goals.find(x=>x.id===el.dataset.goaldone);if(g)g.done=el.type==='checkbox'?el.checked:true;await save();render()};if(el.type==='checkbox')el.onchange=toggle;else el.onclick=toggle});
document.querySelectorAll('[data-delete-goal]').forEach(el=>el.onclick=async()=>{if(confirm('Usunąć ten cel?')){data.goals=data.goals.filter(g=>g.id!==el.dataset.deleteGoal);await save();render()}});
if($('#prevMonth'))$('#prevMonth').onclick=()=>{calendarMonth.setMonth(calendarMonth.getMonth()-1);render()};
if($('#nextMonth'))$('#nextMonth').onclick=()=>{calendarMonth.setMonth(calendarMonth.getMonth()+1);render()};
document.querySelectorAll('[data-calday]').forEach(el=>el.onclick=()=>{selectedDate=el.dataset.calday;render()});
if($('#calendarSelected'))$('#calendarSelected').onchange=()=>{selectedDate=$('#calendarSelected').value;calendarMonth=new Date(selectedDate+'T12:00:00');render()};
if($('#addEvent'))$('#addEvent').onclick=async()=>{const title=prompt('Nazwa wydarzenia');if(!title?.trim())return;const time=prompt('Godzina (opcjonalnie, np. 17:30)','')||'';const description=prompt('Opis (opcjonalnie)','')||'';data.events.push({id:uid(),date:selectedDate,title:title.trim(),time,description});await save();render()};
document.querySelectorAll('[data-delete-event]').forEach(el=>el.onclick=async()=>{data.events=data.events.filter(e=>e.id!==el.dataset.deleteEvent);await save();render()});
if($('#dayToJournal'))$('#dayToJournal').onclick=()=>{currentTab='journal';render()};
if($('#summaryDate'))$('#summaryDate').onclick=()=>{const v=prompt('Podaj datę z tygodnia lub miesiąca, który chcesz zobaczyć',selectedDate);if(v&&/^\d{4}-\d{2}-\d{2}$/.test(v)){selectedDate=v;render()}};
if($('#saveSnapshot'))$('#saveSnapshot').onclick=async()=>{const raw=$('#snapshotAmount').value;const amount=Number(raw);if(raw===''||!Number.isFinite(amount)||amount<0){alert('Wpisz prawidłową kwotę, nie mniejszą niż zero.');return}data.financeSnapshots.push({id:uid(),amount,date:$('#snapshotDate').value||selectedDate,created:new Date().toISOString()});await save();render()};
document.querySelectorAll('[data-delete-snapshot]').forEach(el=>el.onclick=async()=>{if(confirm('Usunąć ten wpis kwoty?')){data.financeSnapshots=data.financeSnapshots.filter(x=>x.id!==el.dataset.deleteSnapshot);await save();render()}});
document.querySelectorAll('[data-delete-fin]').forEach(el=>el.onclick=async()=>{data.finance=data.finance.filter(x=>x.id!==el.dataset.deleteFin);await save();render()});
if($('#addTrade'))$('#addTrade').onclick=async()=>{const p=Number($('#tradeProfit').value);if($('#tradeProfit').value===''||!Number.isFinite(p)){alert('Wpisz wynik transakcji.');return}data.transactions.push({id:uid(),date:$('#tradeDate').value||selectedDate,profit:p,description:$('#tradeDesc').value});await save();render()};
document.querySelectorAll('[data-delete-trade]').forEach(el=>el.onclick=async()=>{data.transactions=data.transactions.filter(x=>x.id!==el.dataset.deleteTrade);await save();render()});
if($('#exportData'))$('#exportData').onclick=async()=>{const vault=getVault();const blob=new Blob([JSON.stringify({app:'Notatki',format:1,...vault},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='notatki-kopia-'+todayISO()+'.json';a.click();URL.revokeObjectURL(url);$('#backupStatus').textContent='Kopia została przygotowana. Zachowaj ją w bezpiecznym miejscu.'};
if($('#importFile'))$('#importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const v=JSON.parse(await f.text());if(!v.salt||!v.box?.cipher||!v.box?.iv)throw Error('format');if(!confirm('Przywrócenie kopii zastąpi bieżące dane. Czy na pewno?'))return;const pin=prompt('Wpisz PIN używany do zaszyfrowania tej kopii');if(!pin)return;const s=unb64(v.salt),k=await derive(pin,s),d=await decryptObj(v.box,k);if(!d.version||!d.logs)throw Error('format');localStorage.setItem('mk_vault',JSON.stringify({v:1,salt:v.salt,box:v.box,updated:new Date().toISOString()}));salt=s;key=k;data=d;render();}catch(err){alert('Nie udało się przywrócić kopii. Sprawdź plik i PIN.');}e.target.value=''};
if($('#autoLock')){ $('#autoLock').value=String(data.settings.autoLock??5);$('#autoLock').onchange=async()=>{data.settings.autoLock=Number($('#autoLock').value);await save();resetLockTimer()} }
if($('#changePin'))$('#changePin').onclick=async()=>{const old=prompt('Wpisz obecny PIN');if(!old)return;try{const v=getVault(),k=await derive(old,unb64(v.salt));await decryptObj(v.box,k)}catch{alert('Nieprawidłowy PIN.');return}const n=prompt('Nowy PIN (6–12 cyfr)');if(!/^\d{6,12}$/.test(n||'')){alert('PIN musi mieć 6–12 cyfr.');return}const c=prompt('Powtórz nowy PIN');if(n!==c){alert('PIN-y nie są takie same.');return}salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(n,salt);await save();alert('PIN został zmieniony.')};
if($('#lockSettings'))$('#lockSettings').onclick=()=>lockApp();
if($('#deleteAll'))$('#deleteAll').onclick=()=>{if(confirm('Usunąć na stałe wszystkie dane z tej aplikacji?')){localStorage.removeItem('mk_vault');data=null;key=null;salt=null;renderLock()}};
}
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
renderLock();
</script>
</body>
</html>
